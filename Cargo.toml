[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuervolu/glaux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
open = { version = "5.4", features = ["shellexecute-on-windows"] }
muda = { version = "0.21", default-features = false }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

directories = "6"
semver = "1"
ron = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

bitflags = "2"
# raylib's default features minus SUPPORT_SCREEN_CAPTURE, which reserves F12 for
# automatic screenshots. Glaux uses F12 for the log panel.
raylib = { version = "6", default-features = false, features = [
    "GLFW_BUILD_X11",
    "USE_AUDIO",
    "SUPPORT_MODULE_RSHAPES",
    "SUPPORT_MODULE_RTEXTURES",
    "SUPPORT_MODULE_RTEXT",
    "SUPPORT_MODULE_RMODELS",
    "SUPPORT_MODULE_RAUDIO",
    "SUPPORT_CAMERA_SYSTEM",
    "SUPPORT_GESTURES_SYSTEM",
    "SUPPORT_RPRAND_GENERATOR",
    "SUPPORT_MOUSE_GESTURES",
    "SUPPORT_SSH_KEYBOARD_RPI",
    "SUPPORT_WINMM_HIGHRES_TIMER",
    "SUPPORT_COMPRESSION_API",
    "SUPPORT_AUTOMATION_EVENTS",
    "SUPPORT_CLIPBOARD_IMAGE",
    "SUPPORT_QUADS_DRAW_MODE",
    "SUPPORT_FILEFORMAT_PNG",
    "SUPPORT_FILEFORMAT_GIF",
    "SUPPORT_FILEFORMAT_QOI",
    "SUPPORT_FILEFORMAT_DDS",
    "SUPPORT_IMAGE_EXPORT",
    "SUPPORT_IMAGE_GENERATION",
    "SUPPORT_FILEFORMAT_TTF",
    "SUPPORT_FILEFORMAT_FNT",
    "SUPPORT_FILEFORMAT_OBJ",
    "SUPPORT_FILEFORMAT_MTL",
    "SUPPORT_FILEFORMAT_IQM",
    "SUPPORT_FILEFORMAT_GLTF",
    "SUPPORT_FILEFORMAT_VOX",
    "SUPPORT_FILEFORMAT_M3D",
    "SUPPORT_MESH_GENERATION",
    "SUPPORT_FILEFORMAT_WAV",
    "SUPPORT_FILEFORMAT_OGG",
    "SUPPORT_FILEFORMAT_MP3",
    "SUPPORT_FILEFORMAT_QOA",
    "SUPPORT_FILEFORMAT_XM",
    "SUPPORT_FILEFORMAT_MOD",
    "SUPPORT_TRACELOG",
] }

mlua = { version = "0.12", features = ["luau"] }
rhai = "1.26"

comrak = { version = "0.57", default-features = false }
rust-embed = { version = "8.13", default-features = false, features = ["debug-embed"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"

tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-luau = "1.2"
cc = "1.2"

pretty_assertions = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

glaux-audio = { path = "crates/glaux-audio" }
glaux-machine = { path = "crates/glaux-machine" }
glaux-video = { path = "crates/glaux-video" }
glaux-input = { path = "crates/glaux-input" }
glaux-modules = { path = "crates/glaux-modules" }
glaux-host-raylib = { path = "crates/glaux-host-raylib" }
glaux-luau = { path = "crates/glaux-luau" }
glaux-script = { path = "crates/glaux-script" }
glaux-rhai = { path = "crates/glaux-rhai" }
glaux-syntax = { path = "crates/glaux-syntax" }
glaux-i18n = { path = "crates/glaux-i18n" }
glaux-docs = { path = "crates/glaux-docs" }
glaux-sense = { path = "crates/glaux-sense" }

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"