[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuervolu/glaux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

directories = "6"
semver = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

bitflags = "2"
raylib = "6"

mlua = { version = "0.12", features = ["luau"] }

pretty_assertions = "1"

glaux-machine = { path = "crates/glaux-machine" }
glaux-video = { path = "crates/glaux-video" }
glaux-input = { path = "crates/glaux-input" }
glaux-host-raylib = { path = "crates/glaux-host-raylib" }