[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuervolu/glaux"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
png = "0.18"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

directories = "6"
semver = "1"
ron = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

bitflags = "2"
raylib = "6"

mlua = { version = "0.12", features = ["luau"] }
rhai = "1.26"

pretty_assertions = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

glaux-audio = { path = "crates/glaux-audio" }
glaux-machine = { path = "crates/glaux-machine" }
glaux-video = { path = "crates/glaux-video" }
glaux-input = { path = "crates/glaux-input" }
glaux-modules = { path = "crates/glaux-modules" }
glaux-host-raylib = { path = "crates/glaux-host-raylib" }
glaux-luau = { path = "crates/glaux-luau" }
glaux-script = { path = "crates/glaux-script" }
glaux-rhai = { path = "crates/glaux-rhai" }
