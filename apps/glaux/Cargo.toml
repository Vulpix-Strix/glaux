[package]
name = "glaux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hotpath.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
png.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
semver.workspace = true
ron.workspace = true
serde.workspace = true
serde_json.workspace = true
glaux-audio.workspace = true
glaux-machine.workspace = true
glaux-modules.workspace = true
glaux-video.workspace = true
glaux-host-raylib.workspace = true
glaux-i18n.workspace = true
glaux-input.workspace = true
glaux-luau.workspace = true
glaux-script.workspace = true
glaux-rhai.workspace = true
glaux-syntax.workspace = true
glaux-docs.workspace = true
glaux-sense.workspace = true
glaux-lsp.workspace = true
rfd.workspace = true
open.workspace = true

[features]
hotpath = ["hotpath/hotpath", "glaux-sense/hotpath", "glaux-syntax/hotpath", "glaux-luau/hotpath", "glaux-rhai/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "glaux-sense/hotpath-alloc", "glaux-syntax/hotpath-alloc", "glaux-luau/hotpath-alloc", "glaux-rhai/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[target.'cfg(target_os = "macos")'.dependencies]
muda.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
pretty_assertions.workspace = true
proptest.workspace = true
