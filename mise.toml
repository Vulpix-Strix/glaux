[tools]
rust = { version = "stable", components = "rustfmt,clippy" }
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"cargo:cargo-mutants" = "27.1.0"
"cargo:cargo-about" = "0.9.2"
python = "3.15"
uv = "latest"

[tasks.check]
run = "cargo check --workspace"

[tasks.test]
run = "cargo nextest run --workspace --no-tests=warn"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.mutants]
description = "Optional mutation testing (glaux-machine by default; pass `-- --file <glob>` to choose files). Can use several GB of RAM"
env = { CARGO_BUILD_JOBS = "2" }
# Mutants that allocate inside frequently executed code (e.g. `Box::leak` in a
# per-pixel accessor) can consume gigabytes per test process. Limiting memory
# is left to the host: e.g. `systemd-run --user --scope -p MemoryMax=8G` on
# Linux. A `cargo install`ed copy in ~/.cargo/bin shadows the pinned version.
run = "cargo mutants --jobs 2"

[tasks.clippy]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.docs-check]
description = "Validate documentation, API catalog, ids, links and UI catalogs, then run the checks that need a script runtime or the system font"
run = [
  "cargo run --quiet -p glaux-docs --bin glaux-docs -- check",
  "cargo nextest run --no-tests=warn -p glaux-luau -p glaux-rhai -p glaux -E 'test(/catalog_consistency|docs_glyphs|ui_glyphs/)'",
]

[tasks.docs-update-ids]
description = "Add the ids of new documentation pages to docs/ids.lock. Published ids are never removed"
run = "cargo run --quiet -p glaux-docs --bin glaux-docs -- update-ids"

[tasks.luau-defs]
description = "Regenerate crates/glaux-luau/definitions/glaux.d.luau from docs/api/*.ron. Skipped when no input changed"
sources = ["docs/api/*.ron", "crates/glaux-luau/src/definitions.rs", "crates/glaux-input/src/lib.rs", "crates/glaux-audio/src/lib.rs"]
outputs = ["crates/glaux-luau/definitions/glaux.d.luau"]
run = "cargo run --quiet -p glaux-luau --bin glaux-luau-defs -- generate"

[tasks.luau-defs-check]
description = "Fail when glaux.d.luau is out of date with the API catalog"
run = "cargo run --quiet -p glaux-luau --bin glaux-luau-defs -- check"

[tasks.luau-lsp-check]
description = "Check glaux.d.luau against a real luau-lsp (set LUAU_LSP to the executable). Not part of verify"
run = "python scripts/luau_lsp_check.py"

[tasks.licenses]
description = "Regenerate apps/glaux/licenses/third-party.json from Cargo.lock with cargo-about"
run = "python scripts/licenses.py generate"

[tasks.licenses-check]
description = "Fail when third-party.json is out of date or extra.json is malformed"
run = "python scripts/licenses.py check"

[tasks.verify]
description = "Run every routine check: format, lint, tests, documentation, Luau definitions and third-party licenses"
depends = ["fmt", "clippy", "test", "docs-check", "luau-defs-check", "licenses-check"]

[tasks.profile]
description = "Play the profiling workloads and write hotpath reports to target/profiling/<label> (pass the label after `--`)"
run = "python scripts/profile.py run"

[tasks.profile-compare]
description = "Compare two labels of `mise run profile` and flag functions that got slower (pass both labels after `--`)"
run = "python scripts/profile.py compare"

[tasks.glaux]
run = "cargo run -p glaux"

[tasks.signal-lost-sheet]
description = "Rebuild examples/signal-lost/sprites.png and code/sheet.luau from the 0x72 DungeonTileset II frames directory given as the argument"
run = "uv run --script examples/signal-lost/tools/build_sheet.py"

[tasks.sync-examples]
description = "Synchronize repository examples into Glaux's local cartridge directory"
run = "python scripts/sync_examples.py"
