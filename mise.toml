[tools]
rust = { version = "stable", components = "rustfmt,clippy" }
"aqua:nextest-rs/nextest/cargo-nextest" = "latest"
"cargo:cargo-mutants" = "27.1.0"
python = "3.13"
uv = "latest"

[tasks.check]
run = "cargo check --workspace"

[tasks.test]
run = "cargo nextest run --workspace --no-tests=warn"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.mutants]
description = "Optional mutation testing (glaux-machine by default; pass `-- --file <glob>` to choose files). Can use several GB of RAM"
env = { CARGO_BUILD_JOBS = "2" }
# Mutants that allocate inside frequently executed code (e.g. `Box::leak` in a
# per-pixel accessor) can consume gigabytes per test process. Limiting memory
# is left to the host: e.g. `systemd-run --user --scope -p MemoryMax=8G` on
# Linux. A `cargo install`ed copy in ~/.cargo/bin shadows the pinned version.
run = "cargo mutants --jobs 2"

[tasks.clippy]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.glaux]
run = "cargo run -p glaux"

[tasks.signal-lost-sheet]
description = "Rebuild examples/signal-lost/sprites.png and code/sheet.luau from the 0x72 DungeonTileset II frames directory given as the argument"
run = "uv run --script examples/signal-lost/tools/build_sheet.py"
